[package]
name = "rowl"
version = "0.1.5"
edition = "2024"
license = "AGPL-3.0-or-later"
keywords = ["semantic-web", "ontology", "dolfin", "knowledge-graph", "language"]
categories = ["compilers", "parsing"]
description = "Parser for the Dolfin Ontology Language"
homepage = "https://www.dolfin.fr"
repository = "https://github.com/dolfin-team/rowl"

[lib]
name = "rowl"
crate-type = ["cdylib", "rlib"]

[dependencies]
logos = "0.16.1"
lalrpop-util = "0.23.0"
walkdir = { version = "2.5.0", optional = true }
thiserror = "2.0.18"
tracing = "0.1"
dolfin-diagnostic = "0.1.3"

[dependencies.pyo3]
version = "0.28.1"
optional = true

[features]
default = []
python = ["pyo3"]
extension-module = ["pyo3/extension-module"]
fs = ["dep:walkdir"]

[build-dependencies]
lalrpop = "0.23.0"
